<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f1ec">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Museek">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/icon-192.png" sizes="192x192">
  <title>Museek | Seek Your Next Sound</title>
  <style>
    :root {
      --paper:#f2f1ec; --paper-2:#e8e7e0; --card:#fbfbf9; --ink:#14140f;
      --muted:#5c5b52; --faint:#85847a; --rule:rgba(20,20,15,.18);
      --accent:#e8009c; --lime:#b6f414; --warn:#a94218; --radius:3px;
      --display:Arial Black,"Noto Sans TC",system-ui,sans-serif;
      --body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
      --mono:Consolas,"SFMono-Regular",monospace;
    }
    * { box-sizing:border-box }
    html { scroll-behavior:smooth }
    body { margin:0; min-height:100dvh; background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.55 }
    body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.22; background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px); background-size:44px 44px }
    button,input,textarea { font:inherit }
    button { color:inherit }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid var(--lime); outline-offset:2px }
    .shell { min-height:100dvh }
    .topbar { height:64px; position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:24px; padding:0 max(20px,calc((100vw - 1180px)/2)); border-bottom:1px solid var(--ink); background:rgba(242,241,236,.96) }
    .brand { border:0; background:none; padding:0; display:flex; align-items:center; gap:9px; font:900 19px/1 var(--display); letter-spacing:-.04em; cursor:pointer }
    .mark { display:grid; place-items:center; width:22px; height:22px; border-radius:2px; background:var(--ink); color:var(--paper); font:900 13px/1 var(--display) }
    .nav-actions { margin-left:auto; display:flex; align-items:center; gap:12px }
    .nav-link { border:0; background:none; color:var(--muted); font-size:13px; cursor:pointer }
    .button { min-height:44px; border:1px solid var(--ink); border-radius:var(--radius); padding:10px 17px; font-weight:800; cursor:pointer; transition:transform .12s ease,box-shadow .12s ease,background .12s ease }
    .button:hover:not(:disabled) { transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--lime) }
    .button:active:not(:disabled) { transform:translateY(1px); box-shadow:none }
    .button:disabled { cursor:not-allowed; opacity:.55 }
    .primary { border-color:var(--accent); background:var(--accent); color:#fff }
    .ghost { background:transparent }
    .quiet { border-color:var(--rule); background:var(--card) }
    main { width:min(1180px,calc(100% - 40px)); margin:0 auto }
    .view { display:none; min-height:calc(100dvh - 64px); animation:enter .45s cubic-bezier(.16,1,.3,1) both }
    .view.active { display:block }
    @keyframes enter { from { opacity:0; transform:translateY(16px) } }

    .hero { min-height:calc(100dvh - 64px); display:grid; grid-template-columns:1.28fr .72fr; gap:7vw; align-items:center; padding:42px 0 }
    .eyebrow { display:flex; align-items:center; gap:10px; margin-bottom:20px; color:var(--accent); font:700 14px/1 var(--mono); letter-spacing:.24em; text-transform:uppercase }
    .eyebrow::before { content:""; width:28px; height:2px; background:var(--accent) }
    h1,h2,h3,p { margin-top:0 }
    h1 { max-width:760px; margin-bottom:22px; font:900 clamp(48px,7.2vw,96px)/.91 var(--display); letter-spacing:-.065em }
    h1 em { display:block; padding-bottom:.08em; font-style:italic; line-height:1.08 }
    .lede { max-width:530px; margin-bottom:28px; color:var(--muted); font-size:16px }
    .actions { display:flex; flex-wrap:wrap; gap:10px }
    .sound-object { height:min(40vh,500px); min-height:340px; display:flex; align-items:flex-end; gap:8px; padding:22px; border:1px solid var(--ink); background:var(--card); box-shadow:9px 9px 0 var(--ink) }
    .sound-object i { flex:1; min-width:4px; height:var(--h); background:var(--lime); transform-origin:bottom; animation:pulse 0.8s ease-in-out infinite alternate; animation-delay:var(--d) }
    .sound-object i:nth-child(3n) { background:var(--ink) }
    .sound-object i:nth-child(4n) { background:var(--accent) }
    @keyframes pulse { to { transform:scaleY(.25) } }

    .center-stage { min-height:calc(100dvh - 64px); display:grid; place-items:center; padding:48px 0 80px }
    .panel { width:min(100%,560px); border:1px solid var(--ink); background:var(--card); padding:clamp(22px,5vw,42px); box-shadow:8px 8px 0 var(--ink) }
    .panel.wide { width:min(100%,760px) }
    .panel.profile-panel { width:min(100%,430px); padding:22px 16px 18px }
    .profile-panel h2 { margin-bottom:4px; font-size:18px; line-height:1.2; letter-spacing:-.02em }
    .panel h2 { margin-bottom:9px; font:900 clamp(30px,5vw,52px)/.98 var(--display); letter-spacing:-.045em }
    .sub { color:var(--muted); font-size:14px }
    .field-group { display:grid; gap:7px; margin-top:25px }
    label { font:700 12px/1.3 var(--mono); color:var(--muted) }
    input,textarea { width:100%; border:1px solid var(--ink); border-radius:var(--radius); background:var(--paper); color:var(--ink); padding:13px 14px }
    textarea { min-height:94px; resize:vertical }
    .field-help { min-height:18px; color:var(--faint); font-size:12px }
    .divider { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin:25px 0; color:var(--faint); font:12px var(--mono) }
    .divider::before,.divider::after { content:""; height:1px; background:var(--rule) }
    .prompts { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 14px }
    .prompt-chip { border:1px solid var(--rule); border-radius:999px; background:var(--paper); padding:7px 11px; color:var(--muted); font-size:12px; cursor:pointer }
    .prompt-chip:hover { border-color:var(--ink); color:var(--ink) }
    .full { width:100% }
    .error-text { color:var(--warn) }

    .profile-grid { display:grid; gap:13px; margin:22px 0 }
    .metric { padding:0; background:transparent }
    .metric-top { display:flex; justify-content:space-between; gap:10px; font:12px var(--mono) }
    .meter { height:7px; margin-top:7px; border:1px solid var(--rule); border-radius:999px; background:var(--paper-2); overflow:hidden }
    .meter span { display:block; height:100%; background:var(--lime) }
    .metric:nth-child(even) .meter span { background:var(--ink) }
    .genre-title { margin:25px 0 9px; color:var(--muted); font-size:13px }
    .genres { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:13px }
    .genre { border:1px solid var(--rule); border-radius:999px; padding:5px 12px; color:var(--muted); font-size:12px }
    .genre.active { border-color:var(--ink); background:var(--ink); color:var(--paper); font-weight:700 }
    .match-note { margin-bottom:10px; padding:11px 13px; border-left:3px solid var(--ink); background:var(--paper-2); font-size:13px }

    .thinking { text-align:center }
    .mini-eq { height:100px; display:flex; align-items:flex-end; justify-content:center; gap:7px; margin:8px 0 32px }
    .mini-eq i { width:12px; height:var(--h); background:var(--accent); animation:pulse 1s ease-in-out infinite alternate; animation-delay:var(--d) }
    .steps { max-width:560px; margin:26px auto 0; text-align:left }
    .step { display:grid; grid-template-columns:14px 1fr auto; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--rule); color:var(--faint); font-size:14px }
    .step-mark { width:12px; height:12px; border:1px solid var(--faint); border-radius:2px }
    .step.done,.step.running { color:var(--ink) }
    .step.done .step-mark { border-color:var(--ink); background:var(--ink) }
    .step.running .step-mark { border-color:var(--lime); background:var(--lime); animation:blink .8s steps(2) infinite }
    @keyframes blink { 50% { opacity:.25 } }
    .step-state { font:10px var(--mono); text-transform:uppercase; letter-spacing:.1em }

    .results { padding:38px 0 90px }
    .results-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:24px }
    .results-head h2 { margin:0; font:900 clamp(34px,5vw,64px)/.95 var(--display); letter-spacing:-.055em }
    .head-actions { display:flex; align-items:flex-end; gap:14px }
    .taste-strip { display:grid; grid-auto-flow:column; gap:11px; padding:9px 12px; border:1px solid var(--rule); background:var(--card) }
    .taste-cell { min-width:62px; font:10px var(--mono); color:var(--faint); letter-spacing:.06em }
    .taste-cell b { display:block; margin-bottom:4px; color:var(--ink); font:700 12px var(--mono) }
    .taste-bar { height:5px; border:1px solid var(--rule); background:var(--paper-2); overflow:hidden }
    .taste-bar span { display:block; height:100%; background:var(--lime); transition:width .55s cubic-bezier(.16,1,.3,1) }
    .taste-cell.moved .taste-bar span { background:var(--accent) }
    .results-layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr); gap:28px; align-items:start }
    .player-side { position:sticky; top:92px }
    /* YouTube RMF：播放器不得有疊加層或外框裝飾，可視區至少 200×200 px */
    .video { aspect-ratio:16/9; min-width:200px; min-height:200px; background:var(--ink) }
    .video iframe { width:100%; height:100%; border:0 }
    .empty-player { width:100%; height:100%; display:grid; place-items:center; color:var(--paper); font:700 13px var(--mono) }
    .now { margin-top:15px; font:900 24px/1.1 var(--display); letter-spacing:-.025em }
    .artist { color:var(--muted); font-size:14px }
    .reason { margin-top:18px; padding:16px 18px; border-left:4px solid var(--accent); background:var(--card); font-size:14px }
    .feature-list { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px }
    .feature { padding:10px; border:1px solid var(--rule); background:var(--paper); font:11px var(--mono) }
    .tracks { display:grid; gap:12px }
    .track { display:grid; grid-template-columns:128px 1fr; gap:13px; border:1px solid var(--rule); background:var(--card); padding:10px; cursor:pointer; transition:transform .12s ease,border-color .12s ease }
    .track:hover,.track.selected { border-color:var(--ink); transform:translateX(-3px) }
    .track.selected { box-shadow:4px 4px 0 var(--lime) }
    .track img { width:128px; aspect-ratio:16/9; object-fit:cover; background:var(--paper-2) }
    .track h3 { margin:1px 0 2px; font:800 15px/1.2 var(--display) }
    .track p { margin:0; color:var(--muted); font-size:12px }
    .feedback { grid-column:1/-1; display:flex; gap:8px }
    .vote { flex:1; min-height:42px; border:1px solid var(--rule); background:var(--paper); cursor:pointer; font-weight:900 }
    .vote:hover { border-color:var(--ink) }
    .vote[aria-pressed=true] { background:var(--ink); color:var(--paper) }
    .empty { padding:50px 24px; border:1px dashed var(--faint); text-align:center; color:var(--muted) }

    .health-button { position:fixed; right:18px; bottom:18px; z-index:25; min-height:40px; border:1px solid var(--ink); border-radius:999px; background:var(--card); padding:8px 13px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); font:11px var(--mono) }
    .health-button::before { content:""; display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:var(--lime) }
    .health-panel { position:fixed; right:18px; bottom:68px; z-index:25; width:min(330px,calc(100vw - 36px)); border:1px solid var(--ink); background:var(--card); padding:17px; box-shadow:6px 6px 0 var(--ink) }
    .health-panel[hidden] { display:none }
    .health-panel h3 { margin-bottom:12px; font:900 17px var(--display) }
    .health-row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--rule); font:12px var(--mono) }

    .overlay { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px; background:rgba(20,20,15,.58) }
    .overlay[hidden] { display:none }
    .dialog { width:min(430px,100%); border:1px solid var(--ink); background:var(--card); padding:25px; box-shadow:8px 8px 0 var(--warn) }
    .dialog h2 { margin-bottom:8px; font:900 25px var(--display) }
    .dialog p { color:var(--muted) }
    .demo-list { display:grid; gap:7px; margin:16px 0 4px }
    .demo-list[hidden] { display:none }
    .demo-list button { min-height:42px; border:1px solid var(--ink); border-radius:var(--radius); background:var(--paper); cursor:pointer; font-weight:800; text-align:left; padding:0 13px }
    .demo-list button:hover { background:var(--lime) }

    @media (max-width:800px) {
      main { width:min(100% - 28px,600px) }
      .topbar { padding:0 15px }
      .nav-link { display:none }
      .hero { grid-template-columns:1fr; gap:28px; padding:38px 0 60px }
      h1 { font-size:clamp(48px,16vw,72px) }
      .sound-object { height:150px; min-height:0; box-shadow:6px 6px 0 var(--ink) }
      .results-layout { grid-template-columns:1fr }
      .player-side { position:static }
      .track { grid-template-columns:128px 1fr }
      .results-head { align-items:flex-start; flex-direction:column }
      .head-actions { width:100%; flex-direction:column; align-items:stretch; gap:10px }
      .taste-strip { justify-content:space-between }
    }
    @media (max-width:480px) {
      .profile-grid,.feature-list { grid-template-columns:1fr }
      .panel { padding:22px 18px; box-shadow:5px 5px 0 var(--ink) }
      .brand { font-size:17px }
      .topbar .button { padding:8px 10px }
    }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto }
      *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; transition:none!important }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="回到 Museek 首頁"><span class="mark">M</span>MUSEEK</button>
      <div class="nav-actions">
        <button class="nav-link" id="taste-nav" data-go="profile">我的品味</button>
        <button class="button primary" data-go="entry">開始體驗</button>
      </div>
    </header>

    <main>
      <section class="view active" id="home">
        <div class="hero">
          <div>
            <div class="eyebrow">AI Music Discovery</div>
            <h1>Seek Your <em>Next Sound.</em></h1>
            <p class="lede">貼上公開歌單，或描述此刻的氛圍。Museek 理解你的音樂品味，探索屬於你的下一個聲音。</p>
            <div class="actions">
              <button class="button primary" data-go="entry">開始體驗</button>
              <button class="button ghost" id="demo-button">我的品味</button>
            </div>
          </div>
          <div class="sound-object" aria-label="動態音訊等化器">
            <i style="--h:42%;--d:-.2s"></i><i style="--h:71%;--d:-.8s"></i><i style="--h:28%;--d:-.5s"></i>
            <i style="--h:80%;--d:-1.1s"></i><i style="--h:56%;--d:-.3s"></i><i style="--h:74%;--d:-.7s"></i>
            <i style="--h:35%;--d:-.9s"></i><i style="--h:78%;--d:-.1s"></i><i style="--h:50%;--d:-.6s"></i>
          </div>
        </div>
      </section>

      <section class="view" id="entry">
        <div class="center-stage">
          <form class="panel" id="entry-form">
            <h2>你想聽什麼？</h2>
            <p class="sub">從熟悉的品味出發，保留一點意外。</p>
            <div class="field-group">
              <label for="playlist">公開 YouTube 歌單</label>
              <input id="playlist" type="url" inputmode="url" placeholder="https://youtube.com/playlist?list=..." autocomplete="url">
              <div class="field-help" id="playlist-help">我們會分析最多 50 首歌曲。</div>
              <button class="button primary full" type="button" id="playlist-submit">解析歌單</button>
            </div>
            <div class="divider">或</div>
            <div class="field-group">
              <label for="mood">描述此刻的氛圍</label>
              <textarea id="mood" placeholder="例如：下雨天開車想放空，但不要太吵"></textarea>
              <div class="prompts">
                <button class="prompt-chip" type="button">深夜開車</button>
                <button class="prompt-chip" type="button">專注工作</button>
                <button class="prompt-chip" type="button">週末散步</button>
              </div>
              <button class="button primary full" type="button" id="mood-submit">開始探索</button>
            </div>
          </form>
        </div>
      </section>

      <section class="view" id="profile">
        <div class="center-stage">
          <div class="panel profile-panel">
            <h2>我讀到的你</h2>
            <p class="sub" id="profile-summary">先解析歌單，建立你的品味輪廓。</p>
            <div class="profile-grid" id="profile-grid"></div>
            <div class="genre-title">常聽歌手</div>
            <div class="genres" id="top-artists"></div>
            <div class="match-note" id="match-note">尚未建立品味資料。</div>
            <button class="button primary full" id="profile-submit">開始探索</button>
          </div>
        </div>
      </section>

      <section class="view" id="thinking">
        <div class="center-stage">
          <div class="panel wide thinking">
            <div class="mini-eq" aria-hidden="true">
              <i style="--h:40%;--d:-.1s"></i><i style="--h:80%;--d:-.5s"></i><i style="--h:55%;--d:-.8s"></i>
              <i style="--h:92%;--d:-.3s"></i><i style="--h:62%;--d:-.7s"></i><i style="--h:35%;--d:-.2s"></i>
            </div>
            <h2>正在為你探索</h2>
            <div class="steps" id="steps"></div>
          </div>
        </div>
      </section>

      <section class="view" id="results">
        <div class="results">
          <div class="results-head">
            <div>
              <div class="eyebrow">Your Selection</div>
              <h2>今日推薦</h2>
            </div>
            <div class="head-actions">
              <div class="taste-strip" id="taste-strip" aria-live="polite"></div>
              <button class="button ghost" data-go="entry">重新探索</button>
            </div>
          </div>
          <div class="results-layout">
            <div class="player-side">
              <div class="video" id="video"><div class="empty-player">選一首歌開始播放</div></div>
              <div class="now" id="now-title">尚未選擇</div>
              <div class="artist" id="now-artist"></div>
              <div class="reason" id="now-reason">點選右側歌曲查看推薦理由。</div>
              <div class="feature-list" id="features"></div>
            </div>
            <div class="tracks" id="tracks"></div>
          </div>
        </div>
      </section>
    </main>

    <button class="health-button" id="health-button" aria-expanded="false">系統健康</button>
    <aside class="health-panel" id="health-panel" hidden>
      <h3>服務狀態</h3>
      <div id="health-content">讀取中</div>
    </aside>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">發生問題</h2>
      <p id="dialog-message"></p>
      <div class="demo-list" id="dialog-demos" hidden></div>
      <button class="button primary full" id="dialog-close">知道了</button>
    </div>
  </div>

  <script>
    // 後端已上線；要回到離線刻版把這裡改回 true 即可。
    const MOCK_MODE = false;
    const state = { sessionId:null, profile:null, previousProfile:null, topArtists:[],
                    matched:0, unmatched:0, tracks:[], selected:null, lastRound:null };
    const $ = id => document.getElementById(id);
    const views = [...document.querySelectorAll(".view")];
    const mockTracks = [
      {
        video_id:"jfKfPfyJRdk",
        title:"Snowfall",
        artist:"Øneheart & reidenshi",
        thumbnail:"https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg",
        reason:"低能量與柔和節奏貼近你的歌單，空間感適合雨天開車時放空。",
        features:{ energy:.34, valence:.42, acousticness:.71, tempo:88 }
      },
      {
        video_id:"5qap5aO4i9A",
        title:"Lofi Hip Hop Radio",
        artist:"Lofi Girl",
        thumbnail:"https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg",
        reason:"節拍穩定且不搶注意力，保留熟悉感，也比你的常聽曲目更安靜。",
        features:{ energy:.41, valence:.54, acousticness:.63, tempo:82 }
      },
      {
        video_id:"DWcJFNfaw9c",
        title:"Coffee Shop Radio",
        artist:"STEEZYASFUCK",
        thumbnail:"https://i.ytimg.com/vi/DWcJFNfaw9c/hqdefault.jpg",
        reason:"爵士取樣增加一點新鮮感，整體音量與速度仍維持舒適。",
        features:{ energy:.46, valence:.61, acousticness:.58, tempo:91 }
      },
      {
        video_id:"lTRiuFIWV54",
        title:"Chillhop Essentials",
        artist:"Chillhop Music",
        thumbnail:"https://i.ytimg.com/vi/lTRiuFIWV54/hqdefault.jpg",
        reason:"溫暖鼓點符合放鬆情境，旋律變化足以避免背景音樂過度單調。",
        features:{ energy:.49, valence:.66, acousticness:.52, tempo:86 }
      },
      {
        video_id:"7NOSDKb0HlU",
        title:"Ambient Study Music",
        artist:"Quiet Quest",
        thumbnail:"https://i.ytimg.com/vi/7NOSDKb0HlU/hqdefault.jpg",
        reason:"大幅降低節奏密度，適合想專注或讓思緒慢下來的時刻。",
        features:{ energy:.22, valence:.47, acousticness:.81, tempo:72 }
      }
    ];
    const steps = [
      ["parse","理解你的情境"],
      ["candidates","取得候選曲目"],
      ["rank","依品味與情境排序"],
      ["verify","驗證可播放曲目"],
      ["explain","生成推薦理由"]
    ];

    function showView(id) {
      views.forEach(view => view.classList.toggle("active", view.id === id));
      window.scrollTo({ top:0, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }

    function showDialog(title, message, demos) {
      $("dialog-title").textContent = title;
      $("dialog-message").textContent = message;
      const list = $("dialog-demos");
      list.innerHTML = "";
      list.hidden = !Array.isArray(demos) || !demos.length;
      (demos || []).forEach(demo => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `試試示範歌單：${demo.name}`;
        button.addEventListener("click", () => {
          $("overlay").hidden = true;
          $("playlist").value = demo.url;
          createSession(demo.url);
        });
        list.appendChild(button);
      });
      $("overlay").hidden = false;
      $("dialog-close").focus();
    }

    function errorMessage(error) {
      if (typeof error === "string") return error;
      if (error?.message) return error.message;
      return "服務暫時無法使用，請稍後再試。";
    }

    async function jsonPost(url, body) {
      const response = await fetch(url, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = data.detail;
        const error = new Error(
          detail && typeof detail === "object" ? detail.message : detail || "請求失敗"
        );
        error.hint = detail && typeof detail === "object" ? detail.hint : null;
        throw error;
      }
      return data;
    }

    async function createSession(playlistUrl) {
      const button = $("playlist-submit");
      button.disabled = true;
      button.textContent = "解析中...";
      $("playlist-help").classList.remove("error-text");
      try {
        const data = MOCK_MODE
          ? await mockSession(playlistUrl)
          : await jsonPost("/api/session", { playlist_url:playlistUrl });
        state.sessionId = data.session_id;
        state.previousProfile = null;
        state.profile = data.profile.vector;
        state.topArtists = data.profile.top_artists || [];
        state.matched = data.matched;
        state.unmatched = data.unmatched;
        renderProfile(data.profile.warning);
        showView("profile");
      } catch (error) {
        $("playlist-help").textContent = errorMessage(error);
        $("playlist-help").classList.add("error-text");
        showDialog("無法解析歌單", errorMessage(error), error?.hint);
      } finally {
        button.disabled = false;
        button.textContent = "解析歌單";
      }

      async function mockSession(playlistUrl) {
        await wait(650);
        if (playlistUrl.toLowerCase().includes("private")) {
          throw new Error("這份歌單目前是私人的，請改用公開連結。");
        }
        return {
          session_id:"mock-session",
          profile:{
            vector:{ energy:.42, valence:.51, danceability:.55, acousticness:.38 },
            warning:null
          },
          matched:41,
          unmatched:7
        };
      }
    }

    function renderProfile(warning) {
      const vector = state.profile || {};
      const labels = { energy:"ENERGY", valence:"VALENCE", danceability:"DANCEABILITY", acousticness:"ACOUSTICNESS" };
      $("profile-grid").innerHTML = Object.entries(labels).map(([key,label]) => {
        const value = Number(vector[key] || 0);
        return `<div class="metric"><div class="metric-top"><span>${label}</span><b>${value.toFixed(2)}</b></div><div class="meter"><span style="width:${Math.round(value * 100)}%"></span></div></div>`;
      }).join("");
      const total = state.matched + state.unmatched;
      $("profile-summary").textContent = `來自 ${total} 首歌的品味輪廓`;
      $("match-note").textContent = warning || `已收錄 ${state.matched} 首，未收錄 ${state.unmatched} 首。`;
      renderTopArtists();
      renderTasteStrip();
    }

    function renderTopArtists() {
      const target = $("top-artists");
      if (!target) return;
      // 歌手名來自歌單標題，一律經過跳脫再進 DOM
      target.innerHTML = (state.topArtists || []).slice(0, 4)
        .map((name, index) => `<span class="genre${index === 0 ? " active" : ""}">${escapeHtml(name)}</span>`)
        .join("") || `<span class="genre">尚未取得</span>`;
    }

    function renderTasteStrip() {
      const strip = $("taste-strip");
      if (!strip) return;
      const vector = state.profile || {};
      const labels = { energy:"ENERGY", valence:"VALENCE", acousticness:"ACOUSTIC" };
      const previous = state.previousProfile || {};
      strip.innerHTML = Object.entries(labels).map(([key, label]) => {
        const value = Number(vector[key] || 0);
        const moved = previous[key] !== undefined && Math.abs(previous[key] - value) > 0.001;
        return `<div class="taste-cell${moved ? " moved" : ""}"><b>${value.toFixed(2)}</b>` +
               `<div class="taste-bar"><span style="width:${Math.round(value * 100)}%"></span></div>` +
               `${label}</div>`;
      }).join("");
    }

    function renderSteps(activeStep) {
      const activeIndex = steps.findIndex(([key]) => key === activeStep);
      $("steps").innerHTML = steps.map(([key,label], index) => {
        const status = index < activeIndex ? "done" : index === activeIndex ? "running" : "";
        const text = status === "done" ? "完成" : status === "running" ? "進行中" : "等待";
        return `<div class="step ${status}" data-step="${key}"><span class="step-mark"></span><span>${label}</span><span class="step-state">${text}</span></div>`;
      }).join("");
    }

    async function readEventStream(response, handlers) {
      if (!response.ok || !response.body) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "串流連線失敗");
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream:!done });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";
        for (const chunk of chunks) {
          let event = "message", data = null;
          chunk.split("\n").forEach(line => {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            if (line.startsWith("data:")) data = JSON.parse(line.slice(5));
          });
          if (data && handlers[event]) await handlers[event](data);
        }
        if (done) break;
      }
    }

    async function recommend(prompt) {
      if (!prompt.trim()) return showDialog("需要一點線索", "請描述你現在想聽的氛圍。");
      if (!state.sessionId) {
        await createSession("https://www.youtube.com/playlist?list=DEMO001");
        if (!state.sessionId) return;
      }
      showView("thinking");
      renderSteps("parse");
      state.tracks = [];
      if (MOCK_MODE) return mockRecommend();
      try {
        const response = await fetch("/api/recommend", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ session_id:state.sessionId, prompt:prompt.trim() })
        });
        await readEventStream(response, {
          thinking(data) {
            const map = { parse:"parse", candidates:"candidates", rank:"rank" };
            renderSteps(map[data.step] || "rank");
          },
          track(data) {
            if (!state.tracks.length) renderSteps("verify");
            state.tracks.push(data);
          },
          error(data) { throw new Error(data.message); },
          done(data) {
            state.lastRound = data;
            renderSteps("explain");
            setTimeout(() => {
              renderResults();
              showView("results");
            }, 350);
          }
        });
      } catch (error) {
        showView("entry");
        showDialog("探索暫停", errorMessage(error));
      }
    }

    async function mockRecommend() {
      for (const step of ["parse","candidates","rank","verify","explain"]) {
        renderSteps(step);
        await wait(430);
      }
      state.tracks = mockTracks.map(track => ({ ...track, features:{ ...track.features } }));
      renderResults();
      showView("results");
    }

    function renderResults() {
      renderTasteStrip();
      if (!state.tracks.length) {
        $("tracks").innerHTML = `<div class="empty">這次沒有找到可播放曲目，換個描述再試一次。</div>`;
        return;
      }
      $("tracks").innerHTML = state.tracks.map((track,index) => `
        <article class="track" data-index="${index}" tabindex="0" role="button" aria-label="播放 ${escapeHtml(track.title)}">
          <img src="${escapeAttr(track.thumbnail)}" alt="" width="128" height="72" loading="lazy">
          <div><h3>${escapeHtml(track.title)}</h3><p>${escapeHtml(track.artist)}</p></div>
          <div class="feedback">
            <button class="vote" data-vote="up" aria-pressed="false" aria-label="喜歡這首">喜歡</button>
            <button class="vote" data-vote="down" aria-pressed="false" aria-label="不喜歡這首">略過</button>
          </div>
        </article>`).join("");
      selectTrack(0);
    }

    function selectTrack(index) {
      const track = state.tracks[index];
      if (!track) return;
      state.selected = index;
      document.querySelectorAll(".track").forEach((el,i) => el.classList.toggle("selected", i === index));
      $("video").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(track.video_id)}?rel=0&playsinline=1" title="${escapeAttr(track.title)}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      $("now-title").textContent = track.title;
      $("now-artist").textContent = track.artist;
      $("now-reason").textContent = track.reason;
      $("features").innerHTML = Object.entries(track.features || {}).map(([key,value]) => `<div class="feature">${escapeHtml(key.toUpperCase())}<br><b>${Number(value).toFixed(key === "tempo" ? 0 : 2)}</b></div>`).join("");
    }

    async function feedback(index, vote, button) {
      const track = state.tracks[index];
      if (!track || button.disabled) return;
      button.disabled = true;
      button.setAttribute("aria-pressed","true");
      if (MOCK_MODE) {
        await wait(350);
        if (vote === "down") {
          state.tracks.push(state.tracks.splice(index,1)[0]);
        }
        renderResults();
        return;
      }
      try {
        const response = await fetch("/api/feedback", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ session_id:state.sessionId, video_id:track.video_id, vote })
        });
        const reranked = [];
        await readEventStream(response, {
          profile(data) {
            state.previousProfile = state.profile;
            state.profile = data.updated_profile;
            renderProfile();
          },
          track(data) { reranked.push(data); },
          done() {
            state.tracks = reranked;
            renderResults();
          }
        });
      } catch (error) {
        button.disabled = false;
        showDialog("回饋未送出", errorMessage(error));
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[char]);
    }
    function escapeAttr(value) { return escapeHtml(value || ""); }
    function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    document.addEventListener("click", event => {
      const go = event.target.closest("[data-go]");
      if (go) {
        const target = go.dataset.go;
        if (target === "profile" && !state.profile) return showDialog("還沒有品味檔案", "先解析一份公開歌單。");
        showView(target);
      }
      const track = event.target.closest(".track");
      const vote = event.target.closest(".vote");
      if (track && !vote) selectTrack(Number(track.dataset.index));
      if (vote) {
        event.stopPropagation();
        feedback(Number(track.dataset.index), vote.dataset.vote, vote);
      }
    });
    document.addEventListener("keydown", event => {
      const track = event.target.closest?.(".track");
      if (track && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectTrack(Number(track.dataset.index));
      }
    });
    document.querySelectorAll(".prompt-chip").forEach(button => button.addEventListener("click", () => {
      $("mood").value = button.textContent;
      $("mood").focus();
    }));
    $("playlist-submit").addEventListener("click", () => {
      const value = $("playlist").value.trim();
      if (!value) return showDialog("缺少歌單連結", "請貼上公開 YouTube 歌單連結。");
      createSession(value);
    });
    $("mood-submit").addEventListener("click", () => recommend($("mood").value));
    $("profile-submit").addEventListener("click", () => recommend("從我的歌單品味出發，推薦有熟悉感但不重複的歌曲"));
    $("demo-button").addEventListener("click", () => createSession("https://www.youtube.com/playlist?list=DEMO001"));
    $("dialog-close").addEventListener("click", () => {
      $("overlay").hidden = true;
      $("playlist").focus();
    });
    $("health-button").addEventListener("click", async () => {
      const panel = $("health-panel");
      panel.hidden = !panel.hidden;
      $("health-button").setAttribute("aria-expanded", String(!panel.hidden));
      if (panel.hidden) return;
      try {
        const health = MOCK_MODE
          ? { youtube:"stub", reccobeats:"stub", llm:"configured", mongo:"ok", quota_used:2400 }
          : await fetch("/api/health").then(response => response.json());
        const labels = {
          ok:"正常", configured:"正常", stub:"stub（未對外）", memory:"記憶體（未接 Mongo）",
          unconfigured:"未設定", unknown:"尚未呼叫", degraded:"降級中", down:"異常"
        };
        const quota = health.quota_limit
          ? `${health.quota_used} / ${health.quota_limit}${health.cache_only ? "（僅用快取）" : ""}`
          : (health.quota_used ?? "N/A");
        $("health-content").innerHTML = ["youtube","reccobeats","llm","mongo"].map(key =>
          `<div class="health-row"><span>${key.toUpperCase()}</span><b>${labels[health[key]] || health[key] || "異常"}</b></div>`).join("") +
          `<div class="health-row"><span>QUOTA</span><b>${quota}</b></div>` +
          (state.lastRound
            ? `<div class="health-row"><span>DROPPED</span><b>${state.lastRound.dropped} 首（查不到／不可嵌入）</b></div>` +
              `<div class="health-row"><span>CACHE HITS</span><b>${state.lastRound.cache_hits ?? 0}</b></div>`
            : "");
      } catch {
        $("health-content").textContent = "無法取得健康狀態";
      }
    });

    console.assert(escapeHtml("<Museek>") === "&lt;Museek&gt;", "HTML escaping must remain active");
    console.assert(steps.length === 5, "The recommendation flow must keep five visible stages");
  </script>
</body>
</html>
